name: Publish Life Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify LVI calculations
        run: node tests/model.test.js
      - name: Verify static pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert p.stat().st_size>100_000
          assert s.count('data-id="')>=9
          assert 'read-data' in s or 'standalone-doc-data' in s
          for name in ['理论与模型.html','研究全文.html']:
              assert Path(name).is_file(), name
          print('PASS: main page, nine cases, standalone reading pages')
          PY
      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp index.html '理论与模型.html' '研究全文.html' _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
